# Servidor del frontend en producción (ticket C27-T9).
# Sirve el build de Vite, reenvía /api/ al backend y agrega cabeceras de seguridad.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No mostrar la versión de nginx en errores ni cabeceras
    server_tokens off;

    # Cabeceras de seguridad básicas. Se heredan en las location que no definen add_header propio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Healthcheck propio de nginx: responde aunque el backend esté caído
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # API: se reenvía al servicio "backend" de Docker Compose.
    # El nombre se resuelve en cada pedido con el DNS interno de Docker (127.0.0.11),
    # así nginx arranca aunque el backend todavía no exista y sigue funcionando si cambia de IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos generados por Vite: llevan un hash en el nombre (index-C5odWnvK.js),
    # así que se pueden cachear un año: si cambian, cambia el nombre.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo (/catalogo, /roadmap...) devuelve index.html
    # y React Router decide qué pantalla mostrar. index.html no se cachea.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}