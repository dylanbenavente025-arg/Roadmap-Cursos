[project]
name = "aprovechaelbug-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.161.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"