# Entorno de desarrollo de AprovechaElBug (TRD §3.3).
# Simple a propósito: sin healthchecks, sin multi-stage, sin optimización de imágenes.
services:
  postgres:
    image: postgres:18.6
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Desde PostgreSQL 18 el volumen se monta en /var/lib/postgresql (no en .../data)
      - pgdata:/var/lib/postgresql

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      # nginx escucha en el 80 dentro del contenedor; se publica en el mismo puerto de siempre
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pgdata: